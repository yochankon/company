name: Fetch 나라장터 입찰정보

on:
  schedule:
    # 4시간마다 실행 (UTC 기준 - 한국시간 = UTC+9)
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 동시에 여러 실행이 겹쳐서 git push가 충돌하는 것을 방지 - 한 번에 하나씩만 실행
concurrency:
  group: fetch-bids
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 입찰정보 가져오기
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: node scripts/fetch-bids.mjs

      - name: 변경사항 커밋
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # bids.json은 타임스탬프만 있는 짧은 파일이라 동시 실행 시 pull --rebase가
          # 매번 충돌한다. 병합을 시도하지 않고, 재시도마다 원격 최신 상태로 완전히
          # 리셋한 뒤 우리가 만든 새 데이터를 다시 덮어써서 커밋한다 (last-write-wins).
          cp public/data/bids.json /tmp/bids-new.json

          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/bids-new.json public/data/bids.json
            git add public/data/bids.json

            git diff --cached --quiet
            if [ "$?" -eq 0 ]; then
              echo "변경사항 없음 - 커밋 생략"
              exit 0
            fi

            git commit -m "chore: 나라장터 입찰정보 자동 업데이트"
            git push origin HEAD:main
            push_status=$?
            if [ "$push_status" -eq 0 ]; then
              pushed=1
              break
            fi
            sleep $((RANDOM % 5 + 1))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "push 재시도 5회 모두 실패"
            exit 1
          fi

          echo "push 성공"
